specVersion: "4.0"
metadata:
  name: com.nespola.contratoswf
type: application
framework:
  name: SAPUI5
  version: 1.97.0
  libraries:
    - name: sap.ui.core
    - name: sap.f
    - name: sap.m
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: sap.ushell
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /sap
            url: https://vhwuzdevci.sap.solnacientesa.com.ar:44300
            client: "400"
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: com.nespola.contratoswf
        ui5Theme: sap_fiori_3
